name: Build & Release Packages

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag to publish/update (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  linux-packages:
    name: Build Linux (.rpm / .deb / .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk2.0-dev \
            libgdk-pixbuf2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libx11-dev \
            binutils

      - name: Install Free Pascal & Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "dist"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/omm-mineral -> target"

      - name: Build and package RPM, DEB, and Tarball
        run: |
          chmod +x ./scripts/build_all.sh
          python3 ./scripts/package_release.py
          ls -lh dist/

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.rpm
            dist/*.deb
            dist/*.tar.gz

  macos-package:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Free Pascal & Lazarus (macOS Cocoa)
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install fpc
          curl -sL "https://gitlab.com/freepascal.org/lazarus/lazarus/-/archive/lazarus_3_6/lazarus-lazarus_3_6.tar.gz" | tar -xz -C /tmp
          rm -rf /tmp/lazarus
          mv /tmp/lazarus-lazarus_3_6 /tmp/lazarus
          make -C /tmp/lazarus lazbuild lcl LCL_PLATFORM=cocoa
          ln -sf /tmp/lazarus/lazbuild "$(brew --prefix)/bin/lazbuild"
          mkdir -p "$HOME/.lazarus"
          cat > "$HOME/.lazarus/environmentoptions.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <CONFIG>
            <EnvironmentOptions>
              <LazarusDirectory Value="/tmp/lazarus"/>
              <CompilerFilename Value="$(command -v fpc)"/>
            </EnvironmentOptions>
          </CONFIG>
          EOF

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/omm-mineral -> target"

      - name: Build and package macOS DMG
        run: |
          chmod +x ./scripts/build_all.sh ./scripts/package_macos.sh
          ./scripts/build_all.sh all
          ./scripts/package_macos.sh 0.1.0
          ls -lh dist/

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/*.dmg

  windows-package:
    name: Build Windows (.zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Free Pascal & Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: "dist"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/omm-mineral -> target"

      - name: Build Windows binaries (FPC + LCL Win32/Win64 + Rust DLL)
        shell: bash
        run: |
          chmod +x ./scripts/build_all.sh
          ./scripts/build_all.sh all

      - name: Package Windows x64 Zip
        shell: pwsh
        run: |
          ./scripts/package_windows.ps1 0.1.0

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [linux-packages, macos-package, windows-package]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          files: |
            release-assets/*.rpm
            release-assets/*.deb
            release-assets/*.tar.gz
            release-assets/*.dmg
            release-assets/*.zip
          generate_release_notes: true
