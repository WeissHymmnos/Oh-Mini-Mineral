[package]
name = "omm-mineral"
version = "0.1.0"
edition = "2021"
publish = false
description = "Oh-My-Mineral on-demand streaming cdylib plugin"

[workspace]

[lib]
name = "omm_mineral"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util"] }


